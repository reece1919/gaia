<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<meta content="light" name="color-scheme">
<meta name="theme-color" content="#356a45">
<meta name="description" content="GAIA — personal plant collection dashboard, care and history">
<title>GAIA — Plant Collection Dashboard</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--text:#1c241d;--muted:#667168;--line:#d8ded7;--accent:#356a45;--accent-soft:#edf5ef;--soft:#e9f1eb;--watch:#8a5a12;--watch-soft:#fff7e8;--concern:#8a3434;--concern-soft:#fff0f0}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.wrap{width:min(100%,1200px);margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:clamp(27px,4vw,36px);line-height:1.08;color:var(--text);letter-spacing:-.02em}
.sub{margin-top:6px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;color:var(--text)}
.stat small{display:block;font-size:10px;line-height:1.2;color:var(--muted);font-weight:750;letter-spacing:.04em}.stat b{display:block;margin-top:3px;font-size:22px;line-height:1;color:var(--text)}
.controls{display:none;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin:0 0 16px}
html.js-enabled .controls{display:grid}
input,select{font:inherit;width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font-size:16px;outline:none}
input:focus,select:focus{border-color:#8eae96;box-shadow:0 0 0 3px rgba(53,106,69,.10)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;color:var(--text);box-shadow:0 1px 2px rgba(20,35,24,.035)}
.card[hidden]{display:none!important}.card>summary{display:block;list-style:none;cursor:pointer;color:var(--text);background:#fff}.card>summary::-webkit-details-marker{display:none}
.photo{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo-missing{font-size:13px;color:var(--muted)}
.summary-body{padding:13px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}.title-block{min-width:0}.name{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;font-style:italic;color:#285737;letter-spacing:.012em;overflow-wrap:anywhere;line-height:1.08}.name::before{content:"✦";flex:0 0 auto;font-family:Georgia,"Times New Roman",serif;font-size:.62em;font-style:normal;font-weight:400;color:#78977e;transform:translateY(-1px)}.species{margin-top:5px;color:#747e76;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.28}.meta-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.meta-tag{display:inline-flex;align-items:center;min-height:20px;padding:3px 7px;border:1px solid #dce5dc;border-radius:999px;background:#f7faf7;color:#5e6c61;font-size:8.5px;font-weight:800;letter-spacing:.055em;line-height:1}
.badge{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--text);background:#fff}
.card[data-status="Good"] .badge,.card[data-status="Excellent"] .badge{color:var(--accent);background:var(--accent-soft);border-color:#cfe0d3}
.card[data-status="Fair"] .badge,.card[data-status="Watch"] .badge{color:var(--watch);background:var(--watch-soft);border-color:#ead9b7}
.card[data-status="Concern"] .badge{color:var(--concern);background:var(--concern-soft);border-color:#e9caca}
.tap-hint{margin-top:9px;font-size:12px;color:var(--accent);font-weight:680}.tap-hint::after{content:"  ›"}.card[open] .tap-hint::after{content:"  ↑"}
.care{border-top:1px solid var(--line);padding:12px;background:#fafcf9;color:var(--text)}.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--text)}.box.full{grid-column:1/-1}.label{font-size:10px;letter-spacing:.05em;font-weight:800;color:var(--muted)}.box p{margin:5px 0 0;font-size:14px;line-height:1.45;color:var(--text)}.next-action{background:var(--accent-soft);border-color:#cfe0d3}.next-action .label{color:var(--accent)}.next-action p{font-weight:650}.unknown{color:var(--muted)!important;font-style:italic}.history-wrap{grid-column:1/-1}.history{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.history>summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.02em;background:#f7faf7}.history>summary::-webkit-details-marker{display:none}.history>summary::after{content:"  ›";float:right}.history[open]>summary::after{content:"  ↓"}.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}.history-item{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-bottom:1px solid #edf0ec}.history-item:nth-child(odd){border-right:1px solid #edf0ec}.history-label{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.history-value{font-size:13px;color:var(--text)}.history-note{grid-column:1/-1;padding:10px 12px;font-size:12px;color:var(--muted);font-style:italic}
.empty{display:none;text-align:center;color:var(--muted);padding:28px 10px}.empty.show{display:block}
@media(hover:hover) and (pointer:fine){.card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.card:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(20,35,24,.07);border-color:#cbd5ca}}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:minmax(0,1fr) 170px}}
@media(max-width:600px){
  .wrap{padding:14px 10px calc(20px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:flex-start;flex-wrap:nowrap;margin-bottom:10px;gap:10px}
  header>div:first-child{min-width:0;flex:1}
  h1{font-size:25px;line-height:1.08}
  .sub{font-size:12.5px;line-height:1.3;margin-top:4px}
  .stats{grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 11px}
  .stats .stat:first-child{display:none}
  .stat{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border-radius:11px}
  .stat small{font-size:9px;letter-spacing:.035em}.stat b{font-size:18px;margin:0;order:-1}
  .controls{grid-template-columns:1fr;gap:7px;margin-bottom:11px}
  input,select{padding:10px 11px;border-radius:10px;font-size:16px}
  .grid{grid-template-columns:1fr;gap:8px}
  .card{border-radius:12px;box-shadow:none}
  .card>summary{display:grid;grid-template-columns:112px minmax(0,1fr);min-height:112px}
  .photo{aspect-ratio:auto;width:112px;height:112px;border-right:1px solid var(--line);align-self:stretch}
  .photo img{object-fit:cover}
  .summary-body{padding:11px 11px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .row{display:block}.badge{display:inline-block;margin-top:7px;font-size:10px;padding:3px 7px}
  .name{font-size:18px;gap:5px}.name::before{font-size:.58em}.species{font-size:9.5px;margin-top:5px;letter-spacing:.06em}.meta-tags{gap:4px;margin-top:6px}.meta-tag{font-size:7.5px;padding:3px 6px;min-height:18px}
  .tap-hint{margin-top:8px;font-size:11px}
  .care{padding:9px;border-top:1px solid var(--line)}
  .care-grid{grid-template-columns:1fr 1fr;gap:7px}
  .box{padding:9px;border-radius:9px}.box.full{grid-column:1/-1}.label{font-size:9px}.box p{font-size:13px;line-height:1.38;margin-top:4px}.history>summary{padding:10px;font-size:11px}.history-item{padding:9px 10px}.history-value{font-size:12px}
}
@media(max-width:380px){.card>summary{grid-template-columns:96px minmax(0,1fr);min-height:104px}.photo{width:96px;height:104px}.care-grid{grid-template-columns:1fr}.box.full{grid-column:auto}.history-wrap{grid-column:auto}.history-grid{grid-template-columns:1fr}.history-item:nth-child(odd){border-right:0}}

.activity{margin:0 0 16px;border:1px solid #d2dfd3;border-radius:14px;padding:15px;background:#edf5ef}
.activity-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.activity h2{margin:0;font-size:16px;color:#285737}.activity-date{font-size:10px;font-weight:750;color:#667168;letter-spacing:.04em}
.activity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.activity-tile{background:#fff;border:1px solid #d8e4da;border-radius:10px;padding:11px}
.activity h3{font-size:12px;margin:0 0 5px;color:#356a45}.activity p{font-size:12px;line-height:1.45;margin:0}.activity-note{margin-top:11px!important;color:#5d6b60}
.pest-tag{background:#fff7e8;color:#8a5a12;border-color:#ead9b7}.care-entry{font-style:normal;color:#435347}.care-entry strong{font-size:11px;color:#356a45}.history-note a{color:#356a45}
.controls{grid-template-columns:minmax(0,1fr) 155px 175px}
@media(max-width:850px){.controls{grid-template-columns:minmax(0,1fr) 145px 165px}.activity-grid{grid-template-columns:1fr}}
@media(max-width:600px){.controls{grid-template-columns:1fr}.activity{padding:11px;margin-bottom:11px}.activity-heading{align-items:flex-start}.activity-date{font-size:9px;white-space:nowrap}.activity h2{font-size:14px}.activity-grid{gap:7px}.activity-tile{padding:9px}.activity p{font-size:12px}.activity-note{margin-top:9px!important}}
</style>
<script>document.documentElement.classList.add('js-enabled');</script>
</head>
<body>
<div class="wrap">
<header>
<div><h1>GAIA</h1><div class="sub">45 plants · updated Oct 12, 2026 · tap for care, priorities &amp; history</div></div>
</header>
<div class="stats">
<div class="stat"><small>TOTAL COLLECTION</small><b>45</b></div>
<div class="stat"><small>GOOD / EXCELLENT</small><b>26</b></div>
<div class="stat"><small>NEEDS ATTENTION</small><b>19</b></div>
</div>
<section aria-label="Recent care and follow-up" class="activity" id="recent-care"><div class="activity-heading"><h2>Recent care &amp; follow-up</h2></div></section><div class="controls" id="controls">
<input autocomplete="off" id="search" placeholder="Search name or species…" type="search" aria-label="Search plant name or species">
<select id="health" aria-label="Filter by health"><option value="all">All health</option><option>Excellent</option><option>Good</option><option>Fair</option><option>Watch</option><option>Concern</option></select>
<select id="focus" aria-label="Collection view"><option value="all">All plants</option><option value="new">New additions (9)</option><option value="mites">Mites reported (6)</option></select></div>
<div class="grid" id="grid">
<div id="loading" role="status" style="grid-column:1/-1;padding:24px;text-align:center;color:var(--muted)">Loading GAIA plant records…</div>
</div>
<div class="empty" id="empty">No plants match those filters.</div>
</div>
<script src="app.js" defer></script>
</body>
</html>
