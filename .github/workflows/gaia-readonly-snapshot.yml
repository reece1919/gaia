name: Publish GAIA read-only reference
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17,23 * * *"
permissions:
  contents: write
concurrency:
  group: gaia-readonly-reference
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install Pillow==11.3.0
      - name: Export owner-approved read-only snapshot
        env:
          GAIA_VIEW_TOKEN: ${{ secrets.GAIA_VIEW_TOKEN }}
        run: python scripts/gaia_reference_snapshot.py
      - name: Commit current reference snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaia-reference/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GAIA read-only reference snapshot"
            git push
          fi
