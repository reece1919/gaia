name: Publish GAIA read-only reference
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gaia_reference_snapshot.py"
      - ".github/workflows/gaia-readonly-snapshot.yml"
      - "plants.json"
  schedule:
    - cron: "17 5,11,17,23 * * *"
permissions:
  contents: write
concurrency:
  group: gaia-readonly-reference
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install Pillow==11.3.0
      - name: Export owner-approved read-only snapshot
        id: export
        env:
          GAIA_VIEW_TOKEN: ${{ secrets.GAIA_VIEW_TOKEN }}
        run: |
          if [ -z "$GAIA_VIEW_TOKEN" ]; then
            echo "::notice::Set repository secret GAIA_VIEW_TOKEN to activate the read-only reference sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/gaia_reference_snapshot.py
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Commit current reference snapshot
        if: steps.export.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaia-reference/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GAIA read-only reference snapshot"
            git push
          fi
