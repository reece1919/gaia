name: Conservatory dictation tests
on:
  pull_request:
    paths:
      - "conservatory-dictation.js"
      - "care.js"
      - "index.html"
      - "tests/conservatory-dictation.test.cjs"
      - "tests/conservatory-care-flow.test.cjs"
      - "tests/conservatory-care-api.test.mjs"
      - "supabase/functions/conservatory-care/**"
      - "supabase/functions/conservatory-mcp/**"
      - "tests/conservatory-mcp-write.test.mjs"
      - "tests/conservatory-propagation-mcp.test.mjs"
      - "supabase/gaia_care_events.sql"
      - "tests/conservatory-mcp-auth-status.test.mjs"
      - "oauth/consent/**"
      - "tests/conservatory-oauth-consent.test.cjs"
      - "tests/conservatory-oauth-readiness.mjs"
      - "compact-shell.js"
      - "tests/conservatory-browser-smoke.cjs"
      - ".github/workflows/conservatory-tests.yml"
permissions:
  contents: read
concurrency:
  group: conservatory-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check conservatory-dictation.js
      - run: node --check care.js
      - run: node --check oauth/consent/consent.js
      - run: node --test tests/conservatory-dictation.test.cjs tests/conservatory-care-flow.test.cjs tests/conservatory-care-api.test.mjs tests/conservatory-oauth-consent.test.cjs tests/conservatory-mcp-auth-status.test.mjs tests/conservatory-mcp-write.test.mjs tests/conservatory-propagation-mcp.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.0
      - run: deno check supabase/functions/conservatory-care/index.ts
      - run: deno check supabase/functions/conservatory-mcp/index.ts

  oauth-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/conservatory-oauth-readiness.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/conservatory-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conservatory-ui-preview
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
