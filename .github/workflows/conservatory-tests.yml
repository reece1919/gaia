name: Conservatory dictation tests
on:
  pull_request:
    paths:
      - "conservatory-dictation.js"
      - "care.js"
      - "index.html"
      - "tests/conservatory-dictation.test.cjs"
      - "tests/conservatory-care-flow.test.cjs"
      - "compact-shell.js"
      - "tests/conservatory-browser-smoke.cjs"
      - ".github/workflows/conservatory-tests.yml"
  push:
    branches: [feature/conservatory-foundation]
    paths:
      - "conservatory-dictation.js"
      - "care.js"
      - "index.html"
      - "tests/conservatory-dictation.test.cjs"
      - "compact-shell.js"
      - "tests/conservatory-browser-smoke.cjs"
      - ".github/workflows/conservatory-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check conservatory-dictation.js
      - run: node --check care.js
      - run: node --test tests/conservatory-dictation.test.cjs tests/conservatory-care-flow.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/conservatory-browser-smoke.cjs
